# GEOFlow ARM development stack. Defaults to native Linux ARM64 images.
name: geoflow-laravel-arm

x-app-dns: &app-dns
  - ${DOCKER_DNS_1:-223.5.5.5}
  - ${DOCKER_DNS_2:-119.29.29.29}

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile
  args:
    PHP_CLI_IMAGE: ${ARM_PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
    COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer/}

x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  AUTO_INIT_ONCE: "false"
  AUTO_MIGRATE: "false"
  AUTO_SEED: "false"
  AUTO_OPTIMIZE: "false"

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - geoflow-arm-vendor:/var/www/html/vendor
  - geoflow-arm-composer-cache:/tmp/composer

x-app-common: &app-common
  platform: ${ARM_DOCKER_PLATFORM:-linux/arm64}
  image: ${ARM_APP_IMAGE:-geoflow-app-arm:latest}
  build: *app-build
  pull_policy: build
  working_dir: /var/www/html
  env_file:
    - ./.env
  dns: *app-dns
  volumes: *app-volumes
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  init:
    <<: *app-common
    container_name: geoflow-arm-init
    command: ["php", "artisan", "optimize:clear"]
    environment:
      <<: *app-environment
      AUTO_GENERATE_APP_KEY: "true"
      COMPOSER_ON_START: "true"
    restart: "no"

  app:
    <<: *app-common
    container_name: geoflow-arm-app
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *app-environment
      COMPOSER_ON_START: "false"
    ports:
      - "${APP_PORT:-18080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  queue:
    <<: *app-common
    container_name: geoflow-arm-queue
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=geoflow,distribution,default
      - --sleep=1
      - --tries=3
      - --timeout=${QUEUE_WORKER_TIMEOUT:-1200}
    environment:
      <<: *app-environment
      COMPOSER_ON_START: "false"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *app-common
    container_name: geoflow-arm-scheduler
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-environment
      COMPOSER_ON_START: "false"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    <<: *app-common
    container_name: geoflow-arm-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *app-environment
      COMPOSER_ON_START: "false"
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  vite:
    platform: ${ARM_DOCKER_PLATFORM:-linux/arm64}
    image: ${ARM_NODE_IMAGE:-node:22-alpine}
    container_name: geoflow-arm-vite
    working_dir: /var/www/html
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-geoflow-reverb-key}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_EXPOSE_PORT:-18081}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    command:
      - sh
      - -lc
      - npm ci --no-audit --no-fund && exec npm run dev -- --host=0.0.0.0 --port=5173
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - geoflow-arm-node-modules:/var/www/html/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/@vite/client"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mcp:
    platform: ${ARM_DOCKER_PLATFORM:-linux/arm64}
    image: ${ARM_NODE_IMAGE:-node:22-alpine}
    container_name: geoflow-arm-mcp
    working_dir: /app
    environment:
      NODE_ENV: development
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_API_TIMEOUT_MS: ${MCP_API_TIMEOUT_MS:-30000}
      GEOFLOW_API_BASE_URL: http://app:8080/api/v1/
    command:
      - sh
      - -lc
      - npm ci --no-audit --no-fund && exec npm run dev
    ports:
      - "${MCP_EXPOSE_PORT:-18082}:3000"
    volumes:
      - ./mcp-server:/app
      - geoflow-arm-mcp-node-modules:/app/node_modules
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  geoflow-arm-composer-cache:
  geoflow-arm-mcp-node-modules:
  geoflow-arm-node-modules:
  geoflow-arm-vendor:
