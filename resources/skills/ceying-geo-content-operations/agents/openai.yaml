interface:
  display_name: "策影GEO品牌增长智能体"
  short_description: "规划品牌增长、AI搜索可见性、内容资产、视频生成和媒体传播"
  default_prompt: "使用 $ceying-geo-content-operations 时先判断我需要的是品牌诊断、推广策略、内容资产、文章站内发布、视频生成、媒体投稿还是效果复盘；需要执行平台动作时，帮助我完成 ceying-geo MCP 的安装、配置、权限确认和只读验证。"
dependencies:
  tools:
    - type: "mcp"
      value: "ceying-geo"
      description: "连接策影GEO平台，执行品牌诊断、素材管理、文章任务、文章站内发布、视频生成、媒体投稿和结果查询。"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
