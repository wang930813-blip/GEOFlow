interface:
  display_name: "策影GEO品牌增长智能体"
  short_description: "用自然语言直达品牌诊断、素材、文章、视频和媒体传播"
  default_prompt: "使用 $ceying-geo-content-operations 时，把我的自然语言请求直接匹配到可执行的 ceying-geo 操作；我要求生成视频时，创建任务后必须继续查询并返回视频生成结果。需要执行平台动作时，帮助我完成 ceying-geo MCP 的安装、配置、权限确认和只读验证。"
dependencies:
  tools:
    - type: "mcp"
      value: "ceying-geo"
      description: "连接策影GEO平台，执行品牌诊断、素材管理、文章任务、文章站内发布、视频生成、媒体投稿和结果查询。"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
