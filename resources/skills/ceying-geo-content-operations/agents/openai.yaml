interface:
  display_name: "策影GEO品牌增长智能体"
  short_description: "诊断品牌可见性并规划、生成、发布和跟踪增长内容"
  default_prompt: "使用 $ceying-geo-content-operations 时先检查 ceying-geo MCP 连接；未发现 geo_* 工具则主动帮助我完成安装、Key 安全配置和连接验证，连接成功后再分析品牌增长问题。"
dependencies:
  tools:
    - type: "mcp"
      value: "ceying-geo"
      description: "连接策影GEO平台，执行品牌诊断、素材管理、文章任务、媒体投稿和结果查询。"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
